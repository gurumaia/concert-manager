name: ci
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      dynamodb:
        image: amazon/dynamodb-local:3.1.0
        ports: ["8765:8000"]
    env:
      DYNAMODB_ENDPOINT: http://127.0.0.1:8765
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
        working-directory: backend
      - run: npm run typecheck
        working-directory: backend
      - run: npm test
        working-directory: backend
      # the Lambda bundle inlines the MCP App page (frontend/dist-app/app.html), so build that first
      - run: npm ci
        working-directory: frontend
      - run: npm run build:app
        working-directory: frontend
      - run: npm run build
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: "frontend/package-lock.json" }
      # the frontend imports types from backend/src, which need backend deps to resolve
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: aws-actions/setup-sam@v2
      - run: sam validate --lint --region us-east-1
