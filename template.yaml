AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Show Manager - MCP-first concert tracker (API + MCP on Lambda, SPA on S3/CloudFront, Cognito, DynamoDB)

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedPattern: '^[a-z0-9-]{2,12}$'
  DomainName:
    Type: String
    Default: concertmanager.enkel.cloud
    Description: Public site name. The app lives here and sign-in at auth.<DomainName>.
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Default: Z003849314L9HGR72UK4Y
    Description: Route 53 hosted zone for DomainName (same account)
  SignInGoogleClientId:
    Type: String
    Default: ''
    Description: Google OAuth web client id for "Sign in with Google" (Cognito). Empty disables Google sign-in. Redirect URI = https://<CognitoDomain>/oauth2/idpresponse
  SignInGoogleClientSecret:
    Type: String
    Default: ''
    NoEcho: true
  CalendarGoogleClientId:
    Type: String
    Default: ''
    Description: Google OAuth web client id used to connect Google Calendar. May be the same client as sign-in. Redirect URI = https://<SiteDomain>/api/google/callback
  CalendarGoogleClientSecret:
    Type: String
    Default: ''
    NoEcho: true
  SetlistFmApiKey:
    Type: String
    Default: ''
    NoEcho: true
    Description: setlist.fm API key (free, https://www.setlist.fm/settings/api). Empty disables setlist lookups; setlists can still be entered by hand.
Conditions:
  HasGoogleSignIn: !And
    - !Not [!Equals [!Ref SignInGoogleClientId, '']]
    - !Not [!Equals [!Ref SignInGoogleClientSecret, '']]

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    MemorySize: 512
    Timeout: 30

Resources:
  # ---------------------------------------------------------------- data
  Table:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub show-manager-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
        - { AttributeName: gsi1pk, AttributeType: S }
        - { AttributeName: gsi1sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: gsi1
          KeySchema:
            - { AttributeName: gsi1pk, KeyType: HASH }
            - { AttributeName: gsi1sk, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      TimeToLiveSpecification: { AttributeName: ttl, Enabled: true }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      SSESpecification: { SSEEnabled: true }

  # Encrypts the stored Google refresh tokens.
  SecretsKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: !Sub Show Manager ${Environment} - Google refresh token encryption
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AccountAdmin
            Effect: Allow
            Principal: { AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root' }
            Action: 'kms:*'
            Resource: '*'

  # ---------------------------------------------------------------- domain
  # CloudFront and Cognito custom domains both require a certificate in us-east-1 (this stack's region).
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      SubjectAlternativeNames: [!Sub 'auth.${DomainName}']
      ValidationMethod: DNS
      DomainValidationOptions:
        - { DomainName: !Ref DomainName, HostedZoneId: !Ref HostedZoneId }
        - { DomainName: !Sub 'auth.${DomainName}', HostedZoneId: !Ref HostedZoneId }

  SiteRecordA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget: { DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2 }

  SiteRecordAAAA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget: { DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2 }

  AuthRecordA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub 'auth.${DomainName}'
      Type: A
      AliasTarget: { DNSName: !GetAtt UserPoolDomain.CloudFrontDistribution, HostedZoneId: Z2FDTNDATAQYW2 }

  # ---------------------------------------------------------------- auth
  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub show-manager-${Environment}
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      UsernameConfiguration: { CaseSensitive: false }
      AccountRecoverySetting:
        RecoveryMechanisms: [{ Name: verified_email, Priority: 1 }]
      Policies:
        PasswordPolicy:
          MinimumLength: 10
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
      Schema:
        - { Name: email, AttributeDataType: String, Required: true, Mutable: true }

  GoogleIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Condition: HasGoogleSignIn
    Properties:
      UserPoolId: !Ref UserPool
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        client_id: !Ref SignInGoogleClientId
        client_secret: !Ref SignInGoogleClientSecret
        authorize_scopes: openid email profile
      AttributeMapping:
        email: email
        # Without this Cognito marks Google users' email unverified, and the API (which requires a verified email) rejects them.
        email_verified: email_verified
        name: name
        username: sub

  # One public (PKCE, no secret) client shared by the web app and MCP clients.
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub show-manager-${Environment}
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile, aws.cognito.signin.user.admin]
      CallbackURLs: [!Sub 'https://${DomainName}/auth/callback', 'http://localhost:5173/auth/callback']
      LogoutURLs: [!Sub 'https://${DomainName}/', 'http://localhost:5173/']
      SupportedIdentityProviders: !If
        - HasGoogleSignIn
        - [COGNITO, !Ref GoogleIdentityProvider]
        - [COGNITO]
      # USER_PASSWORD_AUTH backs the app's own login page (the password goes to Cognito over TLS via the API).
      ExplicitAuthFlows: [ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits: { AccessToken: minutes, IdToken: minutes, RefreshToken: days }

  # Cognito requires the parent domain to resolve (an A record) before it accepts a custom domain.
  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    DependsOn: SiteRecordA
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Sub 'auth.${DomainName}'
      CustomDomainConfig: { CertificateArn: !Ref Certificate }

  # The client id depends on the CloudFront domain, while the function is CloudFront's origin: reading it from SSM
  # at cold start avoids a CloudFormation dependency cycle (Function -> Client -> Distribution -> Function).
  ClientIdParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /show-manager/${Environment}/cognito-client-id
      Type: String
      Value: !Ref UserPoolClient

  # ---------------------------------------------------------------- api + mcp
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub show-manager-api-${Environment}
      # Bundled by `npm run build` in backend/ (esbuild) before `sam build`/`sam deploy`.
      CodeUri: backend/dist/
      Handler: lambda.handler
      Timeout: 120 # the daily setlist sweep makes one throttled setlist.fm call per act; HTTP requests are capped at 30s by API Gateway
      Events:
        # Fetch setlists of recent shows. 09:00 UTC = 06:00 in Sao Paulo, after the night's shows.
        SetlistSweep:
          Type: Schedule
          Properties:
            Schedule: cron(0 9 * * ? *)
        Any:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY
      Environment:
        Variables:
          TABLE_NAME: !Ref Table
          KMS_KEY_ID: !GetAtt SecretsKey.Arn
          USER_POOL_ID: !Ref UserPool
          COGNITO_REGION: !Ref AWS::Region
          COGNITO_DOMAIN: !Sub 'https://auth.${DomainName}'
          PUBLIC_BASE_URL: !Sub 'https://${DomainName}'
          GOOGLE_SIGNIN: !If [HasGoogleSignIn, '1', '0']
          CLIENT_ID_PARAM: !Sub /show-manager/${Environment}/cognito-client-id
          GOOGLE_CLIENT_ID: !Ref CalendarGoogleClientId
          GOOGLE_CLIENT_SECRET: !Ref CalendarGoogleClientSecret
          SETLISTFM_API_KEY: !Ref SetlistFmApiKey
          NODE_OPTIONS: --enable-source-maps
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - Statement:
            - Effect: Allow
              Action: dynamodb:Query
              Resource: !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${Table}/index/gsi1'
            - Effect: Allow
              Action: [kms:Encrypt, kms:Decrypt]
              Resource: !GetAtt SecretsKey.Arn
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/show-manager/${Environment}/cognito-client-id'

  # HTTP API rather than a Lambda function URL: function URLs rename WWW-Authenticate, which breaks MCP OAuth discovery.
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      DisableExecuteApiEndpoint: false

  # ---------------------------------------------------------------- web
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }

  SiteOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub show-manager-${Environment}-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SpaRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub show-manager-${Environment}-spa
      AutoPublish: true
      FunctionConfig: { Comment: Serve index.html for client-side routes, Runtime: cloudfront-js-2.0 }
      FunctionCode: |
        function handler(event) {
          var r = event.request;
          if (r.uri.indexOf('.') === -1) r.uri = '/index.html';
          return r;
        }

  ApiHostFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub show-manager-${Environment}-host
      AutoPublish: true
      FunctionConfig: { Comment: Pass the public host to the origin, Runtime: cloudfront-js-2.0 }
      FunctionCode: |
        function handler(event) {
          var r = event.request;
          r.headers['x-original-host'] = { value: r.headers.host.value };
          return r;
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub Show Manager ${Environment}
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        DefaultRootObject: index.html
        Aliases: [!Ref DomainName]
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteOAC.Id
            S3OriginConfig: { OriginAccessIdentity: '' }
          - Id: api
            DomainName: !Sub '${HttpApi}.execute-api.${AWS::Region}.amazonaws.com'
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6   # CachingOptimized
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03   # SecurityHeadersPolicy
          Compress: true
          FunctionAssociations:
            - { EventType: viewer-request, FunctionARN: !GetAtt SpaRewriteFunction.FunctionMetadata.FunctionARN }
        CacheBehaviors:
          - { PathPattern: '/api/*', TargetOriginId: api, ViewerProtocolPolicy: https-only, AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE], CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad, OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac, FunctionAssociations: [{ EventType: viewer-request, FunctionARN: !GetAtt ApiHostFunction.FunctionMetadata.FunctionARN }] }
          - { PathPattern: '/mcp', TargetOriginId: api, ViewerProtocolPolicy: https-only, AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE], CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad, OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac, FunctionAssociations: [{ EventType: viewer-request, FunctionARN: !GetAtt ApiHostFunction.FunctionMetadata.FunctionARN }] }
          - { PathPattern: '/authorize', TargetOriginId: api, ViewerProtocolPolicy: https-only, AllowedMethods: [GET, HEAD, OPTIONS], CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad, OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac, FunctionAssociations: [{ EventType: viewer-request, FunctionARN: !GetAtt ApiHostFunction.FunctionMetadata.FunctionARN }] }
          - { PathPattern: '/token', TargetOriginId: api, ViewerProtocolPolicy: https-only, AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE], CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad, OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac, FunctionAssociations: [{ EventType: viewer-request, FunctionARN: !GetAtt ApiHostFunction.FunctionMetadata.FunctionARN }] }
          - { PathPattern: '/register', TargetOriginId: api, ViewerProtocolPolicy: https-only, AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE], CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad, OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac, FunctionAssociations: [{ EventType: viewer-request, FunctionARN: !GetAtt ApiHostFunction.FunctionMetadata.FunctionARN }] }
          - { PathPattern: '/.well-known/*', TargetOriginId: api, ViewerProtocolPolicy: https-only, AllowedMethods: [GET, HEAD, OPTIONS], CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad, OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac, FunctionAssociations: [{ EventType: viewer-request, FunctionARN: !GetAtt ApiHostFunction.FunctionMetadata.FunctionARN }] }
          - { PathPattern: '/health', TargetOriginId: api, ViewerProtocolPolicy: https-only, AllowedMethods: [GET, HEAD], CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad, OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac }

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                'AWS:SourceArn': !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

Outputs:
  SiteUrl:
    Value: !Sub 'https://${DomainName}'
  McpUrl:
    Description: Add this as a custom connector in claude.ai
    Value: !Sub 'https://${DomainName}/mcp'
  GoogleCalendarRedirectUri:
    Description: Authorized redirect URI to add to the Google OAuth client used for Calendar
    Value: !Sub 'https://${DomainName}/api/google/callback'
  GoogleSignInRedirectUri:
    Description: Authorized redirect URI to add to the Google OAuth client used for Sign in with Google
    Value: !Sub 'https://auth.${DomainName}/oauth2/idpresponse'
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  SiteBucketName:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref Distribution
