version: 2
updates:
  - package-ecosystem: npm
    directory: "/backend"
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: "/frontend"
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # --- GitHub Actions used by the workflows ---
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
