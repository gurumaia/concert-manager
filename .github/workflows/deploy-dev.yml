# Deploy the dev environment.
#   - push to main      -> auto-deploys that commit to dev (only when files that affect the deployed artifact change);
#   - workflow_dispatch -> manual deploy of ANY ref (main or a feature branch), via the Actions
#     "Run workflow" branch picker or `gh workflow run deploy-dev.yml --ref <branch>`.
# Promotion to prd stays manual (promote.yml).
name: deploy-dev

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "template.yaml"
      - "env/**"
      - ".github/workflows/deploy-dev.yml"
      - ".github/workflows/_deploy.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  dev:
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: dev
    secrets:
      aws_role_arn: ${{ secrets.AWS_DEPLOY_ROLE_DEV }}
      google_client_id: ${{ secrets.GOOGLE_CLIENT_ID_DEV }}
      google_client_secret: ${{ secrets.GOOGLE_CLIENT_SECRET_DEV }}
      setlistfm_api_key: ${{ secrets.SETLISTFM_API_KEY_DEV }}
